name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            configure_preset: macos-arm64-debug

          - os: macos-latest
            configure_preset: macos-x64-debug

          - os: ubuntu-latest
            configure_preset: linux-x64-gcc-debug

          - os: ubuntu-latest
            configure_preset: linux-x64-clang-debug
            do_format: true
            do_tidy: true

          - os: windows-latest
            configure_preset: windows-x64-msvc-debug

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure headless graphics environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> "$GITHUB_ENV"
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &

      - name: Configure headless graphics environment (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> "$GITHUB_ENV"
          vk_icd=$(find "$GITHUB_WORKSPACE" /opt/homebrew /usr/local -name 'MoltenVK_icd.json' -o -name 'vk_icd*.json' 2>/dev/null | head -n 1)
          if [ -n "$vk_icd" ]; then
            echo "VK_ICD_FILENAMES=$vk_icd" >> "$GITHUB_ENV"
          fi

      - name: Configure headless graphics environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'LIBGL_ALWAYS_SOFTWARE=1'
          Add-Content -Path $env:GITHUB_ENV -Value 'MESA_LOADER_DRIVER_OVERRIDE=llvmpipe'
          $vkIcd = Get-ChildItem -Path $env:GITHUB_WORKSPACE, $env:VCPKG_ROOT, 'C:\VulkanSDK' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(MoltenVK_)?vk_icd.*\.json$' } |
            Select-Object -First 1
          if ($vkIcd) {
            Add-Content -Path $env:GITHUB_ENV -Value "VK_ICD_FILENAMES=$($vkIcd.FullName)"
          }

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            g++ \
            clang \
            xvfb \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            libxinerama-dev \
            libxcursor-dev \
            xorg-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Set up MSVC dev cmd (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install -y cmake
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja
          }

      - name: Bootstrap vcpkg (macOS/Linux)
        if: runner.os != 'Windows'
        run: make deps

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git submodule update --init --recursive
          if (!(Test-Path "vcpkg\vcpkg.exe")) { cd vcpkg; .\bootstrap-vcpkg.bat; cd .. }

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.configure_preset }}
